<style>
#vt-citizen-preview {
  color-scheme: light dark;
  --c-bg: light-dark(#edf2f1, #071317);
  --c-surface: light-dark(#ffffff, #102126);
  --c-soft: light-dark(#f2f7f6, #172b31);
  --c-text: light-dark(#122327, #eef7f6);
  --c-muted: light-dark(#5f7376, #9db2b3);
  --c-line: light-dark(#d9e4e2, #2b4247);
  --c-brand: light-dark(#006f72, #56c7c7);
  --c-brand-text: light-dark(#ffffff, #061719);
  --c-danger: light-dark(#c6353d, #ff7479);
  --c-warning: light-dark(#bb6600, #ffb24a);
  --c-success: light-dark(#087a65, #55d2ae);
  --yellow: #e6b800;
  --orange: #e67817;
  --red: #d64049;
  display: grid;
  place-items: center;
  padding: 4px 0;
  background: transparent;
  color: var(--c-text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
#vt-citizen-preview * { box-sizing: border-box; }
#vt-citizen-preview button, #vt-citizen-preview textarea, #vt-citizen-preview a { font: inherit; }
#vt-citizen-preview button,
#vt-citizen-preview a[href],
#vt-citizen-preview select,
#vt-citizen-preview summary { min-height: 44px; }
#vt-citizen-preview .vc-phone {
  width: min(100%, 410px);
  overflow: hidden;
  border: 1px solid var(--c-line);
  border-radius: 25px;
  background: var(--c-bg);
  box-shadow: 0 16px 48px color-mix(in srgb, var(--c-text) 15%, transparent);
}
#vt-citizen-preview .vc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 17px 13px;
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-line);
}
#vt-citizen-preview .vc-brand { display: flex; align-items: center; gap: 10px; }
#vt-citizen-preview .vc-logo {
  display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px;
  background: var(--c-brand); color: var(--c-brand-text);
}
#vt-citizen-preview .vc-logo svg { width: 19px; height: 19px; }
#vt-citizen-preview h1 { margin: 0; font-size: 15px; font-weight: 500; }
#vt-citizen-preview .vc-subtitle { margin: 2px 0 0; color: var(--c-muted); font-size: 11px; }
#vt-citizen-preview .vc-session {
  display: inline-flex; align-items: center; gap: 5px; color: var(--c-success);
  font-size: 11px; font-weight: 500;
}
#vt-citizen-preview .vc-session:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
#vt-citizen-preview .vc-content { padding: 14px; display: grid; gap: 12px; }
#vt-citizen-preview .vc-alert {
  padding: 14px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--c-warning) 10%, var(--c-surface));
  border: 1px solid color-mix(in srgb, var(--c-warning) 30%, var(--c-line));
}
#vt-citizen-preview .vc-alert-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#vt-citizen-preview .vc-alert-type { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: var(--c-warning); }
#vt-citizen-preview .vc-pill {
  padding: 4px 7px; border-radius: 999px; background: color-mix(in srgb, var(--c-warning) 13%, transparent);
  color: var(--c-warning); font-size: 10px; font-weight: 500;
}
#vt-citizen-preview .vc-alert h2 { margin: 9px 0 5px; font-size: 17px; font-weight: 500; }
#vt-citizen-preview .vc-alert p { margin: 0; color: var(--c-muted); font-size: 12px; line-height: 1.45; }
#vt-citizen-preview .vc-checkin { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 11px; }
#vt-citizen-preview .vc-checkin button {
  min-height: 44px; padding: 8px; border: 1px solid color-mix(in srgb, var(--c-warning) 26%, var(--c-line));
  border-radius: 10px; background: var(--c-surface); color: var(--c-text); cursor: pointer; font-size: 11px;
}
#vt-citizen-preview .vc-checkin button.is-selected { border-color: var(--c-brand); background: color-mix(in srgb, var(--c-brand) 10%, var(--c-surface)); }
#vt-citizen-preview .vc-checkin-label { grid-column: 1 / -1; color: var(--c-muted); font-size: 10px; }
#vt-citizen-preview .vc-real-emergency {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 9px 10px; padding: 12px;
  border-radius: 13px;
  background: color-mix(in srgb, var(--c-danger) 7%, var(--c-surface));
  border: 1px solid color-mix(in srgb, var(--c-danger) 25%, var(--c-line));
  color: var(--c-muted); font-size: 11px;
}
#vt-citizen-preview .vc-real-emergency svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--c-danger); }
#vt-citizen-preview .vc-real-emergency strong { color: var(--c-text); font-weight: 500; }
#vt-citizen-preview .vc-call-112 {
  grid-column: 1 / -1; min-height: 49px; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 13px; border-radius: 12px; background: var(--c-danger); color: #ffffff;
  text-decoration: none; font-size: 13px; font-weight: 500;
}
#vt-citizen-preview .vc-call-112 svg { color: currentColor; }
#vt-citizen-preview .vc-call-note { grid-column: 1 / -1; margin: -1px 3px 0; text-align: center; color: var(--c-muted); font-size: 10px; }
#vt-citizen-preview .vc-question { margin: 1px 0 0; font-size: 14px; font-weight: 500; }
#vt-citizen-preview .vc-types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#vt-citizen-preview .vc-type {
  min-height: 58px; display: flex; align-items: center; gap: 8px; padding: 10px;
  border: 1px solid var(--c-line); border-radius: 12px; background: var(--c-surface);
  color: var(--c-text); text-align: left; cursor: pointer;
}
#vt-citizen-preview .vc-type svg { width: 19px; height: 19px; color: var(--c-muted); }
#vt-citizen-preview .vc-type.is-selected {
  border-color: var(--c-brand);
  background: color-mix(in srgb, var(--c-brand) 10%, var(--c-surface));
}
#vt-citizen-preview .vc-type.is-selected svg { color: var(--c-brand); }
#vt-citizen-preview .vc-type span { font-size: 12px; font-weight: 500; }
#vt-citizen-preview .vc-notes { display: grid; gap: 5px; color: var(--c-muted); font-size: 11px; }
#vt-citizen-preview textarea {
  width: 100%; min-height: 69px; resize: vertical; padding: 10px 11px;
  border: 1px solid var(--c-line); border-radius: 11px; background: var(--c-surface); color: var(--c-text);
  font-size: 16px;
}
#vt-citizen-preview textarea::placeholder { color: var(--c-muted); }
#vt-citizen-preview .vc-silent {
  display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 9px 10px;
  border: 1px solid var(--c-line); border-radius: 11px; background: var(--c-surface); color: var(--c-text); font-size: 11px;
}
#vt-citizen-preview .vc-silent input { width: 18px; height: 18px; accent-color: var(--c-brand); }
#vt-citizen-preview .vc-primary, #vt-citizen-preview .vc-secondary, #vt-citizen-preview .vc-quiet {
  width: 100%; min-height: 49px; padding: 11px 13px; border-radius: 12px; cursor: pointer;
}
#vt-citizen-preview .vc-primary { border: 1px solid transparent; background: var(--c-brand); color: var(--c-brand-text); font-weight: 500; }
#vt-citizen-preview .vc-secondary { border: 1px solid var(--c-line); background: var(--c-surface); color: var(--c-text); font-weight: 500; }
#vt-citizen-preview .vc-quiet { border: 0; background: transparent; color: var(--c-muted); }
#vt-citizen-preview button:focus-visible, #vt-citizen-preview textarea:focus-visible, #vt-citizen-preview a:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--c-brand) 36%, transparent); outline-offset: 2px;
}
#vt-citizen-preview .vc-privacy { margin: -3px 5px 2px; color: var(--c-muted); font-size: 10px; text-align: center; line-height: 1.4; }
#vt-citizen-preview .vc-call-head {
  padding: 16px; border-radius: 15px; background: var(--c-surface); border: 1px solid var(--c-line); text-align: center;
}
#vt-citizen-preview .vc-call-icon {
  width: 50px; height: 50px; margin: 0 auto 9px; display: grid; place-items: center;
  border-radius: 50%; background: color-mix(in srgb, var(--c-brand) 12%, transparent); color: var(--c-brand);
}
#vt-citizen-preview .vc-call-icon svg { width: 23px; height: 23px; }
#vt-citizen-preview .vc-call-state { color: var(--c-brand); font-size: 11px; font-weight: 500; }
#vt-citizen-preview .vc-call-head h2 { margin: 5px 0 3px; font-size: 18px; font-weight: 500; }
#vt-citizen-preview .vc-timer { color: var(--c-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#vt-citizen-preview .vc-progress { display: grid; gap: 0; padding: 3px 4px; }
#vt-citizen-preview .vc-step { display: grid; grid-template-columns: 18px 1fr; gap: 9px; min-height: 41px; }
#vt-citizen-preview .vc-step-mark { position: relative; display: flex; justify-content: center; }
#vt-citizen-preview .vc-step-mark:after { content: ""; position: absolute; top: 16px; bottom: -1px; width: 1px; background: var(--c-line); }
#vt-citizen-preview .vc-step:last-child .vc-step-mark:after { display: none; }
#vt-citizen-preview .vc-step-dot { width: 10px; height: 10px; margin-top: 4px; border-radius: 50%; background: var(--c-line); z-index: 1; }
#vt-citizen-preview .vc-step.is-done .vc-step-dot { background: var(--c-success); }
#vt-citizen-preview .vc-step.is-current .vc-step-dot { background: var(--c-brand); box-shadow: 0 0 0 5px color-mix(in srgb, var(--c-brand) 14%, transparent); }
#vt-citizen-preview .vc-step-title { font-size: 12px; font-weight: 500; }
#vt-citizen-preview .vc-step-copy { margin-top: 2px; color: var(--c-muted); font-size: 10px; }
#vt-citizen-preview .vc-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#vt-citizen-preview .vc-tool {
  min-height: 78px; display: grid; justify-items: start; align-content: center; gap: 5px; padding: 11px;
  border: 1px solid var(--c-line); border-radius: 12px; background: var(--c-surface); color: var(--c-text); text-align: left; cursor: pointer;
}
#vt-citizen-preview .vc-tool svg { width: 20px; height: 20px; color: var(--c-brand); }
#vt-citizen-preview .vc-tool strong { font-size: 12px; font-weight: 500; }
#vt-citizen-preview .vc-tool small { color: var(--c-muted); font-size: 10px; }
#vt-citizen-preview .vc-tool.is-complete { border-color: color-mix(in srgb, var(--c-success) 45%, var(--c-line)); }
#vt-citizen-preview .vc-tool.is-complete svg { color: var(--c-success); }
#vt-citizen-preview .vc-evidence-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
#vt-citizen-preview .vc-evidence-title h2 { margin: 0; font-size: 14px; font-weight: 500; }
#vt-citizen-preview .vc-evidence-title span { color: var(--c-muted); font-size: 10px; }
#vt-citizen-preview .vc-shared {
  display: flex; align-items: center; gap: 9px; padding: 10px 11px; border-radius: 11px;
  background: color-mix(in srgb, var(--c-success) 9%, var(--c-surface));
  color: var(--c-success); font-size: 11px;
}
#vt-citizen-preview .vc-shared svg { width: 17px; height: 17px; }
#vt-citizen-preview .vc-share-text { color: var(--c-muted); }
#vt-citizen-preview .vc-share-text strong { display: block; color: var(--c-text); font-weight: 500; }
#vt-citizen-preview .vc-footer {
  padding: 11px 15px 14px; border-top: 1px solid var(--c-line); background: var(--c-surface);
  color: var(--c-muted); font-size: 10px; text-align: center;
}
#vt-citizen-preview .vc-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
#vt-citizen-preview .sr-only {
  position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important;
  overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important;
}
#vt-citizen-preview.is-contrast .vc-phone { --c-line: light-dark(#a8b6b6, #6c8084); }

#vt-citizen-preview.is-large { font-size: 18px; }
#vt-citizen-preview.is-large .vc-phone { width: min(100%, 440px); }
#vt-citizen-preview.is-large .vc-tool strong,
#vt-citizen-preview.is-large .vc-step-title,
#vt-citizen-preview.is-large .vc-notes,
#vt-citizen-preview.is-large .vc-silent { font-size: 14px; }
#vt-citizen-preview.is-large .vc-side-link,
#vt-citizen-preview.is-large .vc-setting-row strong,
#vt-citizen-preview.is-large .vc-feed-item strong,
#vt-citizen-preview.is-large .vc-info-section h3 { font-size: 14px; }
#vt-citizen-preview.is-large .vc-info-section p,
#vt-citizen-preview.is-large .vc-setting-row small,
#vt-citizen-preview.is-large .vc-feed-meta,
#vt-citizen-preview.is-large .vc-weather-copy,
#vt-citizen-preview.is-large .vc-risk-label,
#vt-citizen-preview.is-large .vc-side-status { font-size: 12px; }
#vt-citizen-preview.is-large .vc-info-head h2 { font-size: 22px; }
#vt-citizen-preview.is-large .vc-sidebar { width: min(94%, 350px); }
#vt-citizen-preview .vc-header-controls { display: flex; align-items: center; gap: 5px; }
#vt-citizen-preview .vc-language,
#vt-citizen-preview .vc-access {
  min-height: 44px; border: 1px solid var(--c-line); border-radius: 9px;
  background: var(--c-surface); color: var(--c-text);
}
#vt-citizen-preview .vc-language { padding: 0 5px; font-size: 12px; }
#vt-citizen-preview .vc-access { width: 44px; padding: 0; cursor: pointer; }
#vt-citizen-preview .vc-access svg { width: 18px; height: 18px; }
#vt-citizen-preview .vc-network {
  display: flex; align-items: center; gap: 7px; padding: 9px 10px; border-radius: 10px;
  background: color-mix(in srgb, var(--c-success) 8%, var(--c-surface)); color: var(--c-success); font-size: 11px;
}
#vt-citizen-preview .vc-network.is-low { background: color-mix(in srgb, var(--c-warning) 10%, var(--c-surface)); color: var(--c-warning); }
#vt-citizen-preview .vc-network svg { width: 17px; height: 17px; }
#vt-citizen-preview .vc-network span { color: var(--c-muted); }
#vt-citizen-preview .vc-network strong { display: block; color: var(--c-text); font-weight: 500; }
#vt-citizen-preview .vc-network .vc-mini { margin-left: auto; }
#vt-citizen-preview .vc-optional { border: 1px solid var(--c-line); border-radius: 11px; background: var(--c-surface); }
#vt-citizen-preview .vc-optional summary {
  min-height: 44px; display: flex; align-items: center; padding: 9px 10px; cursor: pointer;
  color: var(--c-text); font-size: 11px; font-weight: 500;
}
#vt-citizen-preview .vc-optional-body { display: grid; gap: 10px; padding: 0 10px 11px; }
#vt-citizen-preview .vc-checkin.three { grid-template-columns: repeat(3, 1fr); margin: 0; }
#vt-citizen-preview .vc-checkin.three .vc-checkin-label { grid-column: 1 / -1; }
#vt-citizen-preview .vc-fields { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
#vt-citizen-preview .vc-field { display: grid; gap: 5px; color: var(--c-muted); font-size: 11px; }
#vt-citizen-preview input[type="number"],
#vt-citizen-preview select.vc-select,
#vt-citizen-preview .vc-message-input {
  width: 100%; min-height: 44px; padding: 8px 9px; border: 1px solid var(--c-line);
  border-radius: 9px; background: var(--c-surface); color: var(--c-text); font-size: 16px;
}
#vt-citizen-preview .vc-message-input { min-height: 64px; }
#vt-citizen-preview .vc-mini {
  min-height: 44px; padding: 7px 9px; border: 1px solid var(--c-line); border-radius: 9px;
  background: var(--c-surface); color: var(--c-text); cursor: pointer; font-size: 11px; font-weight: 500;
}
#vt-citizen-preview .vc-photo-preview {
  display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; align-items: center;
  padding: 10px; border: 1px solid var(--c-line); border-radius: 11px; background: var(--c-surface);
}
#vt-citizen-preview .vc-photo-image {
  width: 88px; aspect-ratio: 4 / 3; display: grid; place-items: center; border-radius: 9px;
  background:
    linear-gradient(145deg, color-mix(in srgb, var(--c-warning) 18%, var(--c-soft)), color-mix(in srgb, var(--c-brand) 20%, var(--c-soft)));
  color: var(--c-text);
}
#vt-citizen-preview .vc-photo-image svg { width: 25px; height: 25px; }
#vt-citizen-preview .vc-photo-copy { display: grid; gap: 6px; color: var(--c-muted); font-size: 11px; }
#vt-citizen-preview .vc-photo-copy strong { color: var(--c-text); font-size: 12px; font-weight: 500; }
#vt-citizen-preview .vc-photo-copy .vc-actions { margin-top: 2px; }
#vt-citizen-preview .vc-urgent {
  border-color: color-mix(in srgb, var(--c-danger) 38%, var(--c-line));
  color: var(--c-danger);
}
#vt-citizen-preview .vc-update-confirm {
  display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 10px;
  background: color-mix(in srgb, var(--c-success) 9%, var(--c-surface)); color: var(--c-success); font-size: 11px;
}
#vt-citizen-preview .vc-update-confirm svg { width: 17px; height: 17px; flex: 0 0 auto; }
#vt-citizen-preview .vc-consent {
  display: grid; gap: 12px; padding: 16px; border: 1px solid var(--c-line); border-radius: 14px;
  background: var(--c-surface); text-align: center;
}
#vt-citizen-preview .vc-consent .vc-call-icon { margin-bottom: 0; }
#vt-citizen-preview .vc-consent h2 { margin: 0; font-size: 18px; font-weight: 500; }
#vt-citizen-preview .vc-consent p { margin: 0; color: var(--c-muted); font-size: 12px; line-height: 1.45; }
#vt-citizen-preview .vc-instruction,
#vt-citizen-preview .vc-location-detail,
#vt-citizen-preview .vc-written {
  display: grid; gap: 8px; padding: 11px; border: 1px solid var(--c-line);
  border-radius: 11px; background: var(--c-surface);
}
#vt-citizen-preview .vc-instruction {
  border-color: color-mix(in srgb, var(--c-brand) 38%, var(--c-line));
  background: color-mix(in srgb, var(--c-brand) 7%, var(--c-surface));
}
#vt-citizen-preview .vc-instruction strong,
#vt-citizen-preview .vc-location-detail strong,
#vt-citizen-preview .vc-written strong { font-size: 12px; font-weight: 500; }
#vt-citizen-preview .vc-instruction p,
#vt-citizen-preview .vc-location-detail p { margin: 0; color: var(--c-muted); font-size: 11px; line-height: 1.45; }
#vt-citizen-preview .vc-actions { display: flex; flex-wrap: wrap; gap: 6px; }
#vt-citizen-preview .vc-summary { display: flex; flex-wrap: wrap; gap: 6px; }
#vt-citizen-preview .vc-summary span { padding: 5px 7px; border-radius: 8px; background: var(--c-soft); color: var(--c-muted); font-size: 11px; }
#vt-citizen-preview .vc-closed { display: grid; gap: 8px; padding: 15px; text-align: center; }
#vt-citizen-preview .vc-closed svg { width: 34px; height: 34px; margin: auto; color: var(--c-success); }
#vt-citizen-preview .vc-closed h2 { margin: 0; font-size: 18px; }
#vt-citizen-preview .vc-closed p { margin: 0; color: var(--c-muted); font-size: 12px; }
#vt-citizen-preview button:disabled { cursor: not-allowed; opacity: .65; }
@media (max-width: 350px) {
  #vt-citizen-preview .vc-checkin.three,
  #vt-citizen-preview .vc-fields { grid-template-columns: 1fr; }
}
@media (max-width: 420px) {
  #vt-citizen-preview { padding: 0; }
  #vt-citizen-preview .vc-phone { border-radius: 17px; }
  #vt-citizen-preview .vc-content { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { #vt-citizen-preview * { scroll-behavior: auto !important; } }

/* Navegación informativa inspirada en la estructura de GVA 112; contenido del piloto */
#vt-citizen-preview .vc-phone { position: relative; width: min(100%, 920px); }
#vt-citizen-preview.is-large .vc-phone { width: min(100%, 920px); }
#vt-citizen-preview .vc-header { position: relative; z-index: 5; }
#vt-citizen-preview .vc-menu-toggle,
#vt-citizen-preview .vc-header-112 {
  min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--c-line); border-radius: 10px; background: var(--c-surface); color: var(--c-text);

      input.addEventListener("change",function(){

      state.publicClientRequestId=state.publicClientRequestId||clientRequestId("checkin");
      state.publicSync=(state.connectedMode||state.lowCoverage)?"queued":"received"; state.publicTime=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
      state.publicReference=state.publicReference||"CK-DEMO-2041"; state.publicUpdated=timeStamp(); state.publicError=""; render(); say(state.publicSync==="queued"?c("queuedTitle"):c("receiptTitle"));
      emitNetwork("vt01:checkin-submit",publicCheckinPayload());

    var retry=document.getElementById("vc-public-retry");

  }
  function call112() {
    return '<section class="vc-real-emergency"><i data-lucide="phone-call" aria-hidden="true"></i><span><strong>' + t("danger") + '</strong><br>' + t("official") + '</span><a class="vc-call-112" href="tel:112" aria-label="' + escapeHTML(t("callLabel")) + '"><i data-lucide="phone" aria-hidden="true"></i>' + t("call") + '</a><span class="vc-call-note">' + t("separate") + '</span></section>';
  }
  function network() {
    var pending = state.queued || state.lowCoverage;
    return '<div class="vc-network' + (pending ? ' is-low' : '') + '"><i data-lucide="' + (pending ? 'cloud-off' : 'cloud-check') + '" aria-hidden="true"></i><span><strong>' + (state.queued ? t("queued") : pending ? t("low") : t("ready")) + '</strong>' + (state.queued ? t("queuedCopy") : t("retryNote")) + '</span>' + (state.queued ? '<button class="vc-mini" id="vc-retry" type="button">' + t("retry") + '</button>' : '') + '</div>';
  }
  function types() {
    return ["dana","rain","fire","other"].map(function (key) {
      return '<button type="button" class="vc-type' + (state.type === key ? ' is-selected' : '') + '" data-type="' + key + '" aria-pressed="' + String(state.type === key) + '"><i data-lucide="' + typeIcons[key] + '" aria-hidden="true"></i><span>' + t(key) + '</span></button>';
    }).join("");
  }
  function checkins() {
    return ["safe","help","trapped"].map(function (key) {
      return '<button type="button" data-checkin="' + key + '" class="' + (state.checkin === key ? 'is-selected' : '') + '" aria-pressed="' + String(state.checkin === key) + '">' + t(key) + '</button>';
    }).join("");
  }
  function options(open) {
    return '<details class="vc-optional"' + (open ? ' open' : '') + '><summary>' + (open ? t("current") : t("optional")) + '</summary><div class="vc-optional-body"><div class="vc-checkin three"><span class="vc-checkin-label">' + t("state") + '</span>' + checkins() + '</div><div class="vc-fields"><label class="vc-field">' + t("people") + '<input id="vc-persons" type="number" min="1" max="20" inputmode="numeric" value="' + state.persons + '"></label><label class="vc-field">' + t("need") + '<select class="vc-select" id="vc-need"><option value="none">' + t("none") + '</option><option value="medication">' + t("medication") + '</option><option value="mobility">' + t("mobility") + '</option><option value="medical">' + t("medical") + '</option><option value="dependent">' + t("dependent") + '</option></select></label></div><label class="vc-silent"><input id="vc-silent" type="checkbox"' + (state.silent ? ' checked' : '') + '>' + t("silent") + '</label></div></details>';
  }
  function bindOptions() {
    screen.querySelectorAll("[data-checkin]").forEach(function (button) {
      button.addEventListener("click", function () { state.checkin = button.dataset.checkin; render(); say(t(state.checkin)); });
    });
    var people = document.getElementById("vc-persons");
    if (people) people.addEventListener("change", function (event) { state.persons = Math.max(1, Math.min(20, Number(event.target.value) || 1)); saveState(); });
    var need = document.getElementById("vc-need");
    if (need) { need.value = state.need; need.addEventListener("change", function (event) { state.need = event.target.value; saveState(); }); }
    var silent = document.getElementById("vc-silent");
    if (silent) silent.addEventListener("change", function (event) { state.silent = event.target.checked; render(); });
  }
  function photoPreview() {
    if (!state.photoDraft) return "";
    return '<section class="vc-photo-preview" aria-labelledby="vc-photo-preview-title"><div class="vc-photo-image" aria-hidden="true"><i data-lucide="image"></i></div><div class="vc-photo-copy"><strong id="vc-photo-preview-title">' + t("photoDraft") + '</strong><span>' + t("preview") + '</span><span id="vc-photo-decision">' + t("photoDecision") + '</span><div class="vc-actions"><button class="vc-mini" id="vc-confirm-photo-draft" type="button">' + t("confirmPreview") + '</button><button class="vc-mini" id="vc-discard-photo-draft" type="button">' + t("discard") + '</button></div></div></section>';
  }
  function bindPhotoPreview() {
    var confirm = document.getElementById("vc-confirm-photo-draft");
    if (confirm) confirm.addEventListener("click", function () {
      state.photo = true;
      state.photoDraft = false;
      render();
      say(t("photoConfirmed"));
    });
    var discard = document.getElementById("vc-discard-photo-draft");
    if (discard) discard.addEventListener("click", function () {
      state.photoDraft = false;
      render();
      say(t("photoDiscarded"));
    });
  }
  function askConsent(kind, returnView) {
    state.consent = kind; state.returnView = returnView; state.view = "consent"; render();
  }
  function consent() {
    var photo = state.consent === "photo";
    screen.innerHTML = '<section class="vc-consent"><div class="vc-call-icon"><i data-lucide="' + (photo ? 'camera' : 'map-pin') + '" aria-hidden="true"></i></div><h2>' + (photo ? t("allowPhoto") : t("allowLocation")) + '</h2><p>' + (photo ? t("photoConsent") : t("locationConsent")) + '</p><p><strong>' + t("only") + '</strong></p><button class="vc-primary" id="vc-confirm" type="button">' + (photo ? t("confirmPhoto") : t("confirmLocation")) + '</button><button class="vc-quiet" id="vc-back" type="button">' + t("back") + '</button></section>';
    document.getElementById("vc-confirm").addEventListener("click", function () {
      if (photo) state.photoDraft = true; else { state.location = true; state.locationAge = 0; }
      state.view = state.returnView; render(); say(photo ? t("photoDraft") : t("locationReady"));
    });
    document.getElementById("vc-back").addEventListener("click", function () { state.view = state.returnView; render(); });
    icons();
  }
  function home() {
    var fireAlert = state.alertScenario === "fire";
    screen.innerHTML =
      '<section class="vc-alert"><div class="vc-alert-head"><span class="vc-alert-type"><i data-lucide="radio" aria-hidden="true"></i>' + (fireAlert ? t("fireTag") : t("danaTag")) + '</span><span class="vc-pill">' + t("test") + '</span></div><h2>' + (fireAlert ? t("fireTitle") : t("danaTitle")) + '</h2><p>' + (fireAlert ? t("fireCopy") : t("danaCopy")) + '</p></section>' +
      publicEntry() +
      call112() +
      '<div class="vc-evidence-title"><h2>' + t("share") + '</h2><span>' + t("pilot") + '</span></div><div class="vc-tools"><button class="vc-tool ' + (state.photo && !state.photoDraft ? 'is-complete' : '') + '" id="vc-photo" type="button"><i data-lucide="' + (state.photoDraft ? 'clock-3' : state.photo ? 'circle-check' : 'camera') + '" aria-hidden="true"></i><strong>' + (state.photoDraft ? t("photoDraft") : state.photo ? t("photoReady") : t("photo")) + '</strong><small>' + (state.photoDraft ? t("preview") : state.photo ? t("readyCopy") : t("camera")) + '</small></button><button class="vc-tool ' + (state.location ? 'is-complete' : '') + '" id="vc-location" type="button"><i data-lucide="' + (state.location ? 'map-pin-check' : 'locate-fixed') + '" aria-hidden="true"></i><strong>' + (state.location ? t("locationReady") : t("location")) + '</strong><small>' + (state.location ? 'Poblats Marítims · ±12 m' : t("ask")) + '</small></button></div>' + photoPreview() +
      '<h2 class="vc-question">' + t("what") + '</h2><div class="vc-types">' + types() + '</div><label class="vc-notes">' + t("describe") + '<textarea id="vc-notes" maxlength="280" placeholder="' + t("placeholder") + '">' + escapeHTML(state.note) + '</textarea></label>' + options(false) +
      '<button class="vc-primary" id="vc-start" type="button"' + (state.photoDraft ? ' disabled aria-describedby="vc-photo-decision"' : '') + '>' + t("send") + '</button><p class="vc-privacy">' + (state.photoDraft ? t("photoDecision") : t("without")) + '</p>' + network();
    screen.querySelectorAll("[data-type]").forEach(function (button) {
      button.addEventListener("click", function () { state.type = button.dataset.type; render(); });
    });
    document.getElementById("vc-photo").addEventListener("click", function () { askConsent("photo","home"); });
    document.getElementById("vc-location").addEventListener("click", function () { askConsent("location","home"); });
    document.getElementById("vc-notes").addEventListener("input", function (event) { state.note = event.target.value; saveState(); });
    document.getElementById("vc-start").addEventListener("click", startCase);
    bindOptions(); bindPhotoPreview();
    var publicOpen=document.getElementById("vc-open-public-checkin");
    if (publicOpen) publicOpen.addEventListener("click",function(){ document.dispatchEvent(new CustomEvent("vt01:open-quick-checkin")); });
    icons();
  }
  function duration() {
    return String(Math.floor(state.seconds / 60)).padStart(2,"0") + ":" + String(state.seconds % 60).padStart(2,"0");
  }
  function timeline() {
    var labels = [t("received"),t("seen"),t("accepted"),t("closed")];
    var details = [state.caseTime + " · " + state.caseReference, state.status >= 1 ? t("pilot") : t("pending"), state.status >= 2 ? t("assigned") : t("pending"), state.status >= 3 ? state.caseTime : t("pending")];
    return '<div class="vc-progress">' + labels.map(function (label,index) {
      var c = state.status === 3 || index < state.status ? " is-done" : index === state.status ? " is-current" : "";
      return '<div class="vc-step' + c + '"><div class="vc-step-mark"><span class="vc-step-dot"></span></div><div><div class="vc-step-title">' + label + '</div><div class="vc-step-copy">' + details[index] + '</div></div></div>';
    }).join("") + '</div>';
  }
  function instruction() {
    if (state.status < 2) return "";
    if (state.connectedMode && !state.remoteInstruction) return "";
    return '<section class="vc-instruction"><strong>' + t("instruction") + ' · ' + state.caseTime + '</strong><p>' + escapeHTML(state.remoteInstruction || t("instructionText")) + '</p><button class="vc-mini" id="vc-read" type="button"' + (state.instructionRead ? ' disabled' : '') + '>' + (state.instructionRead ? t("read") : t("markRead")) + '</button></section>';
  }
  function statusActions() {
    var confirmation = state.statusUpdate === "still" ? t("stillConfirmed") : state.statusUpdate === "worsened" ? t("worsenedConfirmed") : "";
    return '<section class="vc-location-detail"><strong>' + t("worse") + '</strong><div class="vc-actions"><button class="vc-mini" type="button" data-status-update="still" aria-pressed="' + String(state.statusUpdate === "still") + '">' + t("stillHelp") + '</button><button class="vc-mini vc-urgent" type="button" data-status-update="worsened" aria-pressed="' + String(state.statusUpdate === "worsened") + '">' + t("worsened") + '</button></div>' + (confirmation ? '<div class="vc-update-confirm" role="status" aria-live="polite"><i data-lucide="circle-check" aria-hidden="true"></i><span>' + confirmation + '</span></div>' : '') + '</section>';
  }
  function active() {
    if (state.status === 3) { closed(); return; }
    var heading = state.queued ? t("queued") : state.status >= 2 ? t("reviewing") : t("waiting");
    screen.innerHTML =
      '<section class="vc-call-head"><div class="vc-call-icon"><i data-lucide="' + (state.status >= 2 ? 'headset' : 'radio-tower') + '" aria-hidden="true"></i></div><div class="vc-call-state">' + (state.queued ? t("pending") : [t("received"),t("seen"),t("accepted")][state.status]) + '</div><h2>' + heading + '</h2><div class="vc-timer" id="vc-timer">' + escapeHTML(state.caseReference) + ' · ' + state.caseTime + ' · ' + duration() + '</div></section>' +
      network() + (state.queued ? '' : timeline()) + instruction() +
      '<div class="vc-evidence-title"><h2>' + t("share") + '</h2><span>' + t("pilot") + '</span></div>' +
      (state.location ? '<section class="vc-location-detail"><strong>' + t("locationShared") + '</strong><p>39.4702, −0.3768 · ' + t("accuracy") + ' · ' + t("age") + ' ' + (state.locationAge < 60 ? t("now") : Math.floor(state.locationAge / 60) + ' min') + '</p><div class="vc-actions"><button class="vc-mini" id="vc-update-location" type="button">' + t("update") + '</button><button class="vc-mini" id="vc-stop-location" type="button">' + t("stop") + '</button></div></section>' : '<button class="vc-secondary" id="vc-add-location" type="button">' + t("allowLocation") + '</button>') +
      '<div class="vc-tools"><button class="vc-tool ' + (state.photo && !state.photoDraft ? 'is-complete' : '') + '" id="vc-active-photo" type="button"><i data-lucide="' + (state.photoDraft ? 'clock-3' : state.photo ? 'circle-check' : 'camera') + '" aria-hidden="true"></i><strong>' + (state.photoDraft ? t("photoDraft") : state.photo ? t("photoSent") : t("photo")) + '</strong><small>' + (state.photoDraft ? t("preview") : t("camera")) + '</small></button><button class="vc-tool ' + (state.videoStarted ? 'is-complete' : '') + '" id="vc-video" type="button"' + (!state.videoRequested ? ' disabled' : '') + '><i data-lucide="video" aria-hidden="true"></i><strong>' + (state.videoStarted ? t("videoActive") : state.videoRequested ? t("videoOn") : t("videoOff")) + '</strong><small>' + (state.videoRequested ? t("videoOnHint") : t("videoOffHint")) + '</small></button></div>' + photoPreview() +
      options(true) + statusActions() +
      (state.silent ? '<section class="vc-written"><strong>' + t("written") + '</strong><textarea class="vc-message-input" id="vc-message" maxlength="280" placeholder="' + t("msgPlaceholder") + '"></textarea><button class="vc-mini" id="vc-send-message" type="button">' + (state.messageSent ? t("delivered") : t("sendMsg")) + '</button></section>' : '') +
      call112() + '<details class="vc-optional"><summary>' + t("demo") + '</summary><div class="vc-optional-body"><button class="vc-secondary" id="vc-close" type="button">' + t("closeDemo") + '</button></div></details><p class="vc-privacy">' + t("privacy") + '</p>';
    var retry = document.getElementById("vc-retry");
    if (retry) retry.addEventListener("click", function () {
      state.status = 0; state.seconds = 0;
      if (state.connectedMode) { state.queued = true; render(); emitNetwork("vt01:incident-submit",incidentPayload()); }
      else { state.queued = false; state.lowCoverage = false; render(); say(t("retry")); }
    });
    var read = document.getElementById("vc-read");
    if (read) read.addEventListener("click", function () { state.instructionRead = true; render(); say(t("read")); });
    var update = document.getElementById("vc-update-location");
    if (update) update.addEventListener("click", function () { state.locationAge = 0; render(); say(t("locationReady")); });
    var stop = document.getElementById("vc-stop-location");
    if (stop) stop.addEventListener("click", function () { state.location = false; render(); say(t("stop")); });
    var add = document.getElementById("vc-add-location");
    if (add) add.addEventListener("click", function () { askConsent("location","active"); });
    document.getElementById("vc-active-photo").addEventListener("click", function () { askConsent("photo","active"); });
    var video = document.getElementById("vc-video");
    if (state.videoRequested) video.addEventListener("click", function () { state.videoStarted = true; render(); say(t("videoActive")); });
    var msg = document.getElementById("vc-send-message");
    if (msg) msg.addEventListener("click", function () { state.messageSent = true; render(); say(t("delivered")); });
    screen.querySelectorAll("[data-status-update]").forEach(function (button) {
      button.addEventListener("click", function () {
        state.statusUpdate = button.dataset.statusUpdate;
        render();
        say(t(state.statusUpdate === "still" ? "stillConfirmed" : "worsenedConfirmed"));
      });
    });
    document.getElementById("vc-close").addEventListener("click", function () { state.status = 3; clearInterval(timer); render(); say(t("closed")); });
    bindOptions(); bindPhotoPreview(); icons();
  }
  function closed() {
    screen.innerHTML = '<section class="vc-call-head vc-closed"><i data-lucide="circle-check-big" aria-hidden="true"></i><span class="vc-pill">' + escapeHTML(state.caseReference) + ' · ' + t("closed") + '</span><h2>' + t("closedTitle") + '</h2><p>' + t("closedCopy") + '</p></section>' + timeline() + '<div class="vc-summary"><span>' + t(state.type) + '</span><span>' + t(state.checkin) + '</span><span>' + state.persons + ' · ' + t("people") + '</span>' + (state.location ? '<span>GPS ±12 m</span>' : '') + (state.photo ? '<span>' + t("photoSent") + '</span>' : '') + '</div><button class="vc-primary" id="vc-new" type="button">' + t("newReport") + '</button><p class="vc-privacy">' + t("privacy") + '</p>';
    document.getElementById("vc-new").addEventListener("click", reset); icons();
  }
  function startCase() {
    var now = new Date();
    state.caseTime = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
    state.caseClientRequestId=clientRequestId("incident"); state.caseReference=state.connectedMode ? "Pendiente" : "VT-2041"; state.remoteInstruction="";
    state.view = "active"; state.infoView = null; state.drawerOpen = false; state.queued = state.connectedMode || state.lowCoverage; state.status = 0; state.seconds = 0; state.instructionRead = false; state.messageSent = false; state.statusUpdate = null; state.photoDraft = false;
    render(); say(state.queued ? t("queued") : t("received"));
    emitNetwork("vt01:incident-submit",incidentPayload());
    startTimer();
  }
  function startTimer() {
    clearInterval(timer);
    if (state.view !== "active" || state.status === 3) return;
    timer = setInterval(function () {
      state.seconds += 1;
      if (state.location) state.locationAge += 1;
      if (!state.connectedMode && !state.queued && state.status < 1 && state.seconds >= 2) { state.status = 1; render(); say(t("seen")); }
      else if (!state.connectedMode && !state.queued && state.status < 2 && state.seconds >= 4) { state.status = 2; render(); say(t("accepted")); }
      else { var node = document.getElementById("vc-timer"); if (node) node.textContent = state.caseReference + " · " + state.caseTime + " · " + duration(); saveState(); }
    },1000);
  }
  function reset() {
    clearInterval(timer);
    state.view = "home"; state.returnView = "home"; state.type = state.alertScenario === "fire" ? "fire" : "dana";
    state.photo = false; state.photoDraft = false; state.location = false; state.locationAge = 0; state.consent = null;
    state.checkin = "help"; state.persons = 1; state.need = "none"; state.silent = false; state.status = 0;
    state.queued = false; state.seconds = 0; state.caseTime = "10:42"; state.caseReference = "VT-2041"; state.caseClientRequestId = ""; state.remoteInstruction = ""; state.instructionRead = false;
    state.messageSent = false; state.statusUpdate = null; state.videoRequested = false; state.videoStarted = false; state.note = ""; state.infoView = null; state.drawerOpen = false;
    try { window.localStorage.removeItem(storageKey); } catch (error) {}
    render();
  }
  function render() {
    chrome();
    if (state.view === "consent") consent(); else if (state.infoView) infoPanel(); else if (state.view === "home") home(); else active();
    saveState();
  }
  loadSaved();
  document.getElementById("vc-menu-toggle").addEventListener("click",function(){ state.drawerOpen=!state.drawerOpen; render(); });
  document.getElementById("vc-backdrop").addEventListener("click",function(){ state.drawerOpen=false; render(); });
  render();
  if (state.view === "active" && state.status < 3) startTimer();
  if (window.Tweak) {
    var tweak = new Tweak({container:document.querySelector("#vt-citizen-preview .vc-phone"),onChange:render});
    tweak.addSelect(state,"alertScenario",{label:"Escenario visible",options:[{label:"DANA",value:"dana"},{label:"Incendio",value:"fire"}],reference:"citizen.alert-scenario"});
    tweak.addSelect(state,"lang",{label:"Idioma",options:[{label:"Español",value:"es"},{label:"Valencià",value:"val"},{label:"English",value:"en"}],reference:"citizen.language"});
    tweak.addToggle(state,"lowCoverage",{label:"Cobertura limitada",reference:"citizen.low-coverage"});
    tweak.addToggle(state,"videoRequested",{label:"Vídeo solicitado por central",reference:"citizen.video-request"});
    tweak.addToggle(state,"largeText",{label:"Texto grande",reference:"citizen.large-text"});
    tweak.addToggle(state,"contrast",{label:"Contraste reforzado",reference:"citizen.high-contrast"});
  }
  window.VT01Citizen = {
    setConnected:function(enabled){state.connectedMode=enabled === true;render();},
    snapshot:function(){return {incident:incidentPayload(),caseReference:state.caseReference,publicCheckin:publicCheckinPayload(),publicSubmitted:state.publicSubmitted};},
    incidentAcknowledged:function(remote){
      if (!remote || !remote.id) return;
      state.caseReference=String(remote.id).slice(0,24); state.queued=false;
      state.status=remote.status === "closed" ? 3 : remote.status === "accepted" ? 2 : 0;
      state.videoRequested=Boolean(remote.mediaRequests && remote.mediaRequests.video === "requested");
      if (typeof remote.instruction === "string" && remote.instruction !== state.remoteInstruction) { state.remoteInstruction=remote.instruction.slice(0,500); state.instructionRead=false; }
      render(); say(t("received"));
    },
    incidentFailed:function(){state.queued=true;render();},
    checkinAcknowledged:function(response){
      if (!response || !response.id) return;
      var receivedAt=String(response.serverReceivedAt || "");
      var parsed=receivedAt ? new Date(receivedAt) : new Date();
      state.publicReference=String(response.id).slice(0,24); state.publicSync="received";
      state.publicTime=String(parsed.getHours()).padStart(2,"0")+":"+String(parsed.getMinutes()).padStart(2,"0");
      state.publicUpdated=timeStamp(); render(); say(c("receiptTitle"));
    },
    checkinFailed:function(){state.publicSync="queued";render();}
  };
})();
</script>

  <script src="/assets/citizen-api.js"></script>
  <script src="/assets/citizen-v2.js"></script>
</body>
